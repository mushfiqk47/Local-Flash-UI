<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diffusion Chat</title>
    <script>
        // Safeguard to prevent "Cannot set property fetch of #<Window> which has only a getter" error
        // caused by certain third-party environment polyfills/packagers attempting to assign global fetch.
        (function() {
            try {
                const originalFetch = window.fetch;
                Object.defineProperty(window, 'fetch', {
                    value: originalFetch,
                    writable: true,
                    configurable: true,
                    enumerable: true
                });
            } catch (e) {
                console.warn('Unable to redefine window.fetch:', e);
            }
        })();
    </script>
    <link rel="stylesheet" href="/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "@google/genai": "https://esm.sh/@google/genai@^0.7.0",
                "react": "https://esm.sh/react@^19.0.0",
                "react/": "https://esm.sh/react@^19.0.0/",
                "react-dom/": "https://esm.sh/react-dom@^19.0.0/"
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
